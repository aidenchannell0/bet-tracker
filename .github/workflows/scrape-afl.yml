name: Scrape AFL stats
on:
  schedule:
        # Every 6 hours — 1 am, 7 am, 1 pm, 7 pm AEST. Tighter than daily, so
    # freshly-settled bets get their actual game stats within ~6h of
    # the final siren, not the next morning.
    - cron: "0 */6 * * *"
  workflow_dispatch: {}
jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      - run: node scripts/scrape-afl-stats.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
