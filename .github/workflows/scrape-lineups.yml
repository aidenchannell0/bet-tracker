name: Scrape AFL lineups
on:
  schedule:
    # Hourly on AEST game days (Thu–Sun) — catch team announcements as they drop
    # Thursday evening and any late changes right up to the first bounce.
    - cron: "0 * * * 0,4,5,6"
  workflow_dispatch: {}
jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      - run: node scripts/scrape-afl-lineups.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
